<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated / Ambient Geometric Graphic Elements (In Background) -->
  <g opacity="0.25">
    <!-- Glowing Orbs -->
    <circle cx="200" cy="80" r="140" fill="url(#glow)"/>
    <circle cx="1000" cy="220" r="160" fill="url(#glow)"/>
    
    <!-- Grid pattern -->
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 8"/>
    <path d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300" stroke="#475569" stroke-width="0.5" stroke-dasharray="4 8"/>

    <!-- Dynamic Identity / Security Nodes in Background -->
    <g fill="none" stroke="#818cf8" stroke-width="1.5">
      <!-- Shield Outline -->
      <path d="M 150 150 L 180 120 L 210 150 L 210 190 Q 180 220 180 220 Q 180 220 150 190 Z" stroke="#38bdf8" stroke-width="2" fill="#0f172a" fill-opacity="0.5"/>
      <!-- Keylock Lines -->
      <path d="M 1020 80 Q 1050 50 1080 80 T 1140 80" stroke="#c084fc" stroke-dasharray="5 5">
        <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite" />
      </path>
      <!-- Network Nodes -->
      <circle cx="100" cy="220" r="6" fill="#38bdf8"/>
      <circle cx="180" cy="250" r="4" fill="#818cf8"/>
      <circle cx="1050" cy="120" r="8" fill="#c084fc"/>
      <circle cx="1120" cy="180" r="5" fill="#38bdf8"/>
      <line x1="100" y1="220" x2="180" y2="250" stroke="#38bdf8" stroke-opacity="0.5"/>
      <line x1="1050" y1="120" x2="1120" y2="180" stroke="#c084fc" stroke-opacity="0.5"/>
    </g>
  </g>

  <!-- Title & Subtitle Foreground (High Contrast, Perfectly Layered Above Background) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Top Decorative Badge -->
    <rect x="440" y="32" width="320" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="600" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">CYBERSECURITY &amp; IDENTITY STACK</text>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Identity Governance &amp; Administration
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0">
      Curated Ecosystem of Enterprise IGA SaaS Platforms &amp; Open-Source Identity Engines
    </text>

    <!-- Feature Tag Highlights -->
    <g transform="translate(260, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🔐 Access Certification</text>

      <!-- Tag 2 -->
      <rect x="200" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
      <text x="280" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#818cf8">⚡ Lifecycle JML</text>

      <!-- Tag 3 -->
      <rect x="380" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="455" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🛡️ SoD Enforcement</text>

      <!-- Tag 4 -->
      <rect x="550" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="615" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399">🌟 Open-Source</text>
    </g>
  </g>
</svg>
